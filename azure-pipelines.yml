
# ==========================================
# GIFT OF THE GIVERS
# PART 3 - AUTOMATED TESTING AND SQL DEPLOYMENT
# ==========================================

trigger:
  - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:

# ==========================================
# STEP 1 - INSTALL .NET 8
# ==========================================

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# ==========================================
# STEP 2 - AUTHENTICATE NUGET FEEDS
# ==========================================

- task: NuGetAuthenticate@1
  displayName: 'Authenticate NuGet feeds'

# ==========================================
# STEP 3 - RESTORE DEPENDENCIES
# ==========================================

- task: DotNetCoreCLI@2
  displayName: 'Restore test project dependencies'
  inputs:
    command: 'restore'
    projects: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
    feedsToUse: 'select'
    vstsFeed: 'ST10452934'
    includeNuGetOrg: true

# ==========================================
# STEP 4 - BUILD TEST PROJECT
# ==========================================

- script: >
    dotnet build
    "GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj"
    --configuration $(buildConfiguration)
    --no-restore
  displayName: 'Build test project'

# ==========================================
# STEP 5 - RUN AUTOMATED TESTS
# ==========================================

# Selenium tests are excluded because they
# require a running local website and Chrome.

- script: >
    dotnet test
    "GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj"
    --configuration $(buildConfiguration)
    --no-build
    --filter "FullyQualifiedName!~SeleniumTests"
    --logger "trx;LogFileName=automated-tests.trx"
    --results-directory "$(Agent.TempDirectory)/TestResults"
  displayName: 'Run unit, integration and load tests'

# ==========================================
# STEP 6 - PUBLISH TEST RESULTS
# ==========================================

- task: PublishTestResults@2
  displayName: 'Publish automated test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Agent.TempDirectory)/TestResults'
    failTaskOnFailedTests: true
    testRunTitle: 'Gift of the Givers Automated Tests'

# ==========================================
# STEP 7 - DEPLOY AZURE SQL SCHEMA UPDATE
# ==========================================

- task: SqlAzureDacpacDeployment@1
  displayName: 'Deploy Azure SQL schema update'
  inputs:
    azureSubscription: 'GiftOfTheGivers-AzureConnection'
    AuthenticationType: 'server'
    ServerName: 'giftofthegivers-karabo-sql.database.windows.net'
    DatabaseName: 'GiftOfTheGiversDB'
    SqlUsername: '$(SqlAdminUsername)'
    SqlPassword: '$(SqlAdminPassword)'
    deployType: 'SqlTask'
    SqlFile: '$(Build.SourcesDirectory)/Gift of the Givers/Database/001_AddLastUpdatedToReliefProjects.sql'
    IpDetectionMethod: 'AutoDetect'

  
# ==========================================
# STEP 10 - DEPLOY AZURE SQL SCHEMA UPDATE
# ==========================================

- task: SqlAzureDacpacDeployment@1
  displayName: 'Deploy Azure SQL schema update'
  inputs:
    azureSubscription: 'GiftOfTheGivers-AzureConnection'
    AuthenticationType: 'server'
    ServerName: 'giftofthegivers-karabo-sql.database.windows.net'
    DatabaseName: 'GiftOfTheGiversDB'
    SqlUsername: '$(SqlAdminUsername)'
    SqlPassword: '$(SqlAdminPassword)'
    deployType: 'SqlTask'
    SqlFile: '$(Build.SourcesDirectory)/Gift of the Givers/Database/001_AddLastUpdatedToReliefProjects.sql'
    IpDetectionMethod: 'AutoDetect'
